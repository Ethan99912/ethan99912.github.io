<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A8 - Stickman</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
  <script>

  // Tarea 13 - Stickman
  // Ethan Vazquez

  // Sol
  let xS, yS, dS, rS, vS;

  // Luna
  let xL, yL, dL, rL, vL;

  // Calendario
  let dia, mes, anio;

  // Personaje
  let xP, yP, S, vP;

  // Salto
  let groundY, vY, jumpV, g;

  function setup() {
    createCanvas(900, 500);
    
    // Sol
    dS = width * 0.18;      
    rS = dS / 2;
    yS = height * 0.35;     
    xS = -rS;                  
    vS = width / 380;

    // Luna
    dL = dS * 0.5;
    rL = dL / 2;
    yL = height * 0.22;
    xL = -width - rL;
    vL = vS;

    // Fecha
    dia = 1;
    mes = 1;
    anio = 2025;

    // Suelo
    groundY = height * 0.78;

    // Stickman
    S = min(width, height) * 0.12;

    xP = width * 0.25;
    yP = groundY;

    vP = width / 150;

    // Salto
    vY = 0;
    jumpV = -height * 0.03;
    g = height * 0.0016;
  }

  function draw() {

    // Fondo según posición del sol
    if (xS <= width + rS) {
      background(135, 200, 235);
    } else {
      background(10, 10, 30);
    }

    // Suelo
    noStroke();
    fill(34, 140, 50);
    rect(0, height * 0.78, width, height * 0.22);

    // Sol
    fill(255, 215, 0);
    circle(xS, yS, dS);

    // Luna
    fill(230, 230, 240);
    circle(xL, yL, dL);

    // Movimiento sol y luna
    xS = xS + vS;
    xL = xL + vL;

    // Reinicio
    if (xS >= 2 * width - rS) {

      xS = -rS;
      xL = -width - rL;

      // suma dia
      dia = dia + 1;

      // cambio mes
      if (dia > 30) {
        dia = 1;
        mes = mes + 1;
      }

      // cambio anio
      if (mes > 12) {
        mes = 1;
        anio = anio + 1;
      }

    }

    // Movimiento personaje
    if (keyIsDown(LEFT_ARROW)) {
      xP = xP - vP;
    }
    
    else if (keyIsDown(RIGHT_ARROW)) {
      xP = xP + vP;
    }

    // Limites
    if (xP < 0) {
      xP = 0;
    }

    if (xP > width) {
      xP = width;
    }

    // Gravedad
    vY = vY + g;
    yP = yP + vY;

    // Suelo
    if (yP > groundY) {
      yP = groundY;
      vY = 0;
    }

    // Stickman
    stroke(255, 140, 40);
    strokeWeight(5);
    noFill();

    // cara
    circle(xP, yP - S, S * 0.4);

    // cuerpo
    line(xP, yP - S * 0.8, xP, yP - S * 0.2);

    // brazos
    line(xP - S * 0.25, yP - S * 0.6,
         xP + S * 0.25, yP - S * 0.6);

    // piernas
    line(xP, yP - S * 0.2,
         xP - S * 0.2, yP);

    line(xP, yP - S * 0.2,
         xP + S * 0.2, yP);

    // Texto fecha
    textSize(18);

    if (xS <= width + rS) {
      fill(0);
    } else {
      fill(255);
    }

    noStroke();
    text("Fecha: " + dia + "/" + mes + "/" + anio, 20, 30);

  }

  // Salto
  function keyPressed() {

    if (keyCode === UP_ARROW) {

      if (yP == groundY) {
        vY = jumpV;
      }

    }

  }

  </script>
  </body>
</html>
