<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>A4 - Sol Tierra Luna</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>

<script>

// Tarea 9 - Sistema Sol Tierra Luna
// Ethan Vazquez

// centro y sol
let centerX;
let centerY;
let sunSize;

// tierra
let earthR;
let earthD;
let earthTheta;
let earthOmega;

let earthX;
let earthY;

// luna
let moonR;
let moonD;
let moonTheta;
let moonOmega;

let moonX;
let moonY;

function setup(){

  createCanvas(900,700);

  // centro
  centerX = width/2;
  centerY = height/2;

  // sol
  sunSize = min(width,height) * 0.21;

  // tierra
  earthR = min(width,height) * 0.36;
  earthD = sunSize * 0.28;

  earthTheta = PI/2;
  earthOmega = 0.010;

  // luna
  moonR = earthD * 0.9;
  moonD = earthD * 0.30;

  moonTheta = 0;
  moonOmega = 0.075;

}

function draw(){

  background(6,8,30);

  // estrellas random
  fill(255);

  circle(80,90,2);
  circle(200,140,3);
  circle(350,60,2);
  circle(760,120,3);
  circle(840,200,2);

  circle(120,620,3);
  circle(500,650,2);
  circle(720,560,3);

  // orbita tierra
  noFill();
  stroke(60);
  circle(centerX,centerY,earthR*2);

  // sol
  noStroke();
  fill(255,190,30);
  circle(centerX,centerY,sunSize);

  // tierra
  earthX = centerX + cos(earthTheta) * earthR;
  earthY = centerY + sin(earthTheta) * earthR;

  fill(60,130,255);
  circle(earthX,earthY,earthD);

  // orbita luna
  noFill();
  stroke(100);
  circle(earthX,earthY,moonR*2);

  // luna
  moonX = earthX + cos(moonTheta) * moonR;
  moonY = earthY + sin(moonTheta) * moonR;

  noStroke();
  fill(220,220,230);
  circle(moonX,moonY,moonD);

  // movimiento
  earthTheta = earthTheta + earthOmega;
  moonTheta = moonTheta + moonOmega;

  // texto
  fill(255);
  textSize(15);
  text("Tarea 9 - Sol Tierra Luna",20,30);

}

</script>

</body>

</html>
