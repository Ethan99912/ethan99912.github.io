<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>A3 - Sistema Solar</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>

<script>

// Tarea 8 - Sistema Solar
// Ethan Vazquez

// sol
let xS;
let yS;
let dS;

// mercurio
let xMercurio;
let yMercurio;
let dMercurio;
let orbitaMercurio;
let angMercurio;
let velMercurio;

// venus
let xVenus;
let yVenus;
let dVenus;
let orbitaVenus;
let angVenus;
let velVenus;

// tierra
let xTierra;
let yTierra;
let dTierra;
let orbitaTierra;
let angTierra;
let velTierra;

// marte
let xMarte;
let yMarte;
let dMarte;
let orbitaMarte;
let angMarte;
let velMarte;

// jupiter
let xJupiter;
let yJupiter;
let dJupiter;
let orbitaJupiter;
let angJupiter;
let velJupiter;

// saturno
let xSaturno;
let ySaturno;
let dSaturno;
let orbitaSaturno;
let angSaturno;
let velSaturno;

// urano
let xUrano;
let yUrano;
let dUrano;
let orbitaUrano;
let angUrano;
let velUrano;

// neptuno
let xNeptuno;
let yNeptuno;
let dNeptuno;
let orbitaNeptuno;
let angNeptuno;
let velNeptuno;

function setup(){

  createCanvas(950,700);

  // sol
  xS = width/2;
  yS = height/2;
  dS = min(width,height) * 0.17;

  // mercurio
  dMercurio = dS * 0.10;
  orbitaMercurio = min(width,height) * 0.22;
  angMercurio = 0;
  velMercurio = 0.030;

  // venus
  dVenus = dS * 0.22;
  orbitaVenus = min(width,height) * 0.30;
  angVenus = PI/4;
  velVenus = 0.018;

  // tierra
  dTierra = dS * 0.24;
  orbitaTierra = min(width,height) * 0.38;
  angTierra = PI/2;
  velTierra = 0.012;

  // marte
  dMarte = dS * 0.14;
  orbitaMarte = min(width,height) * 0.46;
  angMarte = PI;
  velMarte = 0.009;

  // jupiter
  dJupiter = dS * 0.60;
  orbitaJupiter = min(width,height) * 0.58;
  angJupiter = PI/3;
  velJupiter = 0.005;

  // saturno
  dSaturno = dS * 0.50;
  orbitaSaturno = min(width,height) * 0.70;
  angSaturno = PI + 1;
  velSaturno = 0.003;

  // urano
  dUrano = dS * 0.34;
  orbitaUrano = min(width,height) * 0.82;
  angUrano = PI/1.5;
  velUrano = 0.002;

  // neptuno
  dNeptuno = dS * 0.32;
  orbitaNeptuno = min(width,height) * 0.94;
  angNeptuno = PI/6;
  velNeptuno = 0.0015;

}

function draw(){

  background(8,10,30);

  // estrellas random
  fill(255);
  circle(80,90,2);
  circle(200,140,3);
  circle(420,60,2);
  circle(700,100,3);
  circle(850,180,2);
  circle(150,620,3);
  circle(500,650,2);
  circle(760,580,3);

  // sol
  fill(255,190,40);
  circle(xS,yS,dS);

  // mercurio
  xMercurio = xS + cos(angMercurio) * orbitaMercurio/2;
  yMercurio = yS + sin(angMercurio) * orbitaMercurio/2;

  fill(160,150,140);
  circle(xMercurio,yMercurio,dMercurio);

  // venus
  xVenus = xS + cos(angVenus) * orbitaVenus/2;
  yVenus = yS + sin(angVenus) * orbitaVenus/2;

  fill(210,170,100);
  circle(xVenus,yVenus,dVenus);

  // tierra
  xTierra = xS + cos(angTierra) * orbitaTierra/2;
  yTierra = yS + sin(angTierra) * orbitaTierra/2;

  fill(70,130,255);
  circle(xTierra,yTierra,dTierra);

  // marte
  xMarte = xS + cos(angMarte) * orbitaMarte/2;
  yMarte = yS + sin(angMarte) * orbitaMarte/2;

  fill(220,90,70);
  circle(xMarte,yMarte,dMarte);

  // jupiter
  xJupiter = xS + cos(angJupiter) * orbitaJupiter/2;
  yJupiter = yS + sin(angJupiter) * orbitaJupiter/2;

  fill(220,180,120);
  circle(xJupiter,yJupiter,dJupiter);

  // saturno
  xSaturno = xS + cos(angSaturno) * orbitaSaturno/2;
  ySaturno = yS + sin(angSaturno) * orbitaSaturno/2;

  fill(230,210,140);
  circle(xSaturno,ySaturno,dSaturno);

  // anillo d saturno
  noFill();
  stroke(230,220,170);
  ellipse(xSaturno,ySaturno,dSaturno+30,dSaturno-5);
  noStroke();

  // urano
  xUrano = xS + cos(angUrano) * orbitaUrano/2;
  yUrano = yS + sin(angUrano) * orbitaUrano/2;

  fill(120,220,230);
  circle(xUrano,yUrano,dUrano);

  // neptuno
  xNeptuno = xS + cos(angNeptuno) * orbitaNeptuno/2;
  yNeptuno = yS + sin(angNeptuno) * orbitaNeptuno/2;

  fill(80,100,240);
  circle(xNeptuno,yNeptuno,dNeptuno);

  // movimiento
  angMercurio = angMercurio + velMercurio;
  angVenus = angVenus + velVenus;
  angTierra = angTierra + velTierra;
  angMarte = angMarte + velMarte;

  angJupiter = angJupiter + velJupiter;
  angSaturno = angSaturno + velSaturno;
  angUrano = angUrano + velUrano;
  angNeptuno = angNeptuno + velNeptuno;

  // texto
  fill(255);
  textSize(15);
  text("Tarea 8 - Sistema Solar",20,30);

}

</script>

</body>
</html>
