<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title> A2 - Variables</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>

<script>

// Tarea 7 variables
// Ethan Vazquez

let xGlobo;
let yGlobo;
let velocidad;

let tam;

let xCar;
let velCar;

function setup(){

  createCanvas(900,550);

  xGlobo = 670;
  yGlobo = 420;
  velocidad = 1.2;

  tam = 75;

  xCar = -120;
  velCar = 2.8;

}

function draw(){

  background(100,210,230);

  // suelo hierba
  fill(70,150,80);
  rect(0,400,900,150);

  // arbol
  fill(110,67,25);
  rect(170,325,30,120);

  fill(45,125,55);
  circle(185,285,tam);

  tam = tam + 0.08;

  // globo q sube
  fill(255,90,120);
  circle(xGlobo,yGlobo,55);

  stroke(40);
  line(xGlobo,yGlobo+27,xGlobo,yGlobo+105);
  noStroke();

  yGlobo = yGlobo - velocidad;

  // coche
  fill(170,40,110);
  rect(xCar,365,115,42,6);

  fill(50);
  rect(xCar+18,340,55,28);

  // ruedas coche
  fill(20);
  circle(xCar+25,408,26);
  circle(xCar+85,408,26);

  xCar = xCar + velCar;

  // texto
  fill(0);
  textSize(15);
  text("Tarea 7 - variables y movimientos",20,25);

}

</script>

</body>
</html>
