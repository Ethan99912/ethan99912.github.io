<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba 3D</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

<a-scene>

  <a-sky color="#222"></a-sky>

  <a-plane
    position="0 0 -4"
    rotation="-90 0 0"
    width="6"
    height="6"
    color="#555">
  </a-plane>

  <!-- CASA -->

  <a-box
    position="0 0.5 -4"
    width="1"
    height="1"
    depth="1"
    color="#d98c3f">
  </a-box>

  <a-cone
    position="0 1.3 -4"
    radius-bottom="0.8"
    height="0.6"
    color="red">
  </a-cone>

  <a-box
    position="0 0.15 -3.48"
    width="0.25"
    height="0.5"
    depth="0.05"
    color="brown">
  </a-box>

  <a-camera position="0 1.6 0"></a-camera>

</a-scene>

</body>
</html>
